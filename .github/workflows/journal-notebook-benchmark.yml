name: journal-notebook-benchmark
on:
  push:
    paths:
      - '.github/workflows/journal-notebook-benchmark.yml'
      - 'notebooks/10_Paper_Tables_Figures_and_Manifest.ipynb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-notebook-benchmark
  cancel-in-progress: false

jobs:
  run-cumulative:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reproducible CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'matplotlib==3.9.2' 'nbformat==5.10.4' 'nbclient==0.10.2' 'ipykernel==6.29.5'
      - name: Check notebook structure, compile code and local synthetic tests
        run: |
          python - <<'PY'
          import ast, nbformat
          p='notebooks/10_Paper_Tables_Figures_and_Manifest.ipynb'
          nb=nbformat.read(p,as_version=4)
          nbformat.validate(nb)
          code=[c.source for c in nb.cells if c.cell_type=='code']
          assert len(code)==6,len(code)
          for i,part in enumerate(code):compile(part,f'cell_{i}.py','exec')
          print('Notebook JSON/AST syntax PASS; code cells:',len(code))
          PY
      - name: Execute cumulative N05-N10 against pinned real sources
        run: |
          python - <<'PY'
          import nbformat,nbclient,time
          inp='notebooks/10_Paper_Tables_Figures_and_Manifest.ipynb'
          nb=nbformat.read(inp,as_version=4)
          started=time.monotonic()
          try:
              nbclient.NotebookClient(nb,timeout=2400,kernel_name='python3',allow_errors=False,resources={'metadata':{'path':'.'}}).execute()
          except Exception as ex:
              print('Execution failed; no raw email data will be uploaded. Error type:',type(ex).__name__)
              raise
          print('Cumulative notebook executed; seconds:',round(time.monotonic()-started,1))
          PY
      - name: Verify aggregate-only output manifest
        if: success()
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('.')
          for i in range(5,11):
              folder=root/f'phishing_n{i:02d}_safe'
              manifest=folder/'run_manifest.json'
              if not manifest.exists():raise SystemExit(f'Missing {manifest}')
              data=json.loads(manifest.read_text())
              print('N',i,'outputs:',len(list(folder.iterdir())),'release:',data.get('release'))
          PY
      - name: Upload privacy-screened aggregate artifacts only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: journal-N05-N10-safe-aggregates
          path: |
            phishing_n05_safe/
            phishing_n06_safe/
            phishing_n07_safe/
            phishing_n08_safe/
            phishing_n09_safe/
            phishing_n10_safe/
          if-no-files-found: error
          retention-days: 30
