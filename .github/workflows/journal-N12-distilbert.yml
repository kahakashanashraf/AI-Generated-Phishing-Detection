name: journal-N12-DistilBERT-real-training
on:
  push:
    paths:
      - '.github/workflows/journal-N12-distilbert.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-N12-distilbert
  cancel-in-progress: false

jobs:
  fine-tune:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      N12_ALLOW_CPU: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU torch and reproducible transformer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'matplotlib==3.9.2' 'nbformat==5.10.4' 'nbclient==0.10.2' 'ipykernel==6.29.5' 'transformers==4.46.3' 'safetensors==0.4.5' 'huggingface-hub==0.26.5'
      - name: Syntax and protocol guardrail validation
        run: |
          python - <<'PY'
          import ast,nbformat
          p='notebooks/12_DistilBERT_Fine_Tune_External_Reliability.ipynb'
          nb=nbformat.read(p,as_version=4)
          nbformat.validate(nb)
          code=[c.source for c in nb.cells if c.cell_type=='code']
          assert len(code)==5,len(code)
          for i,s in enumerate(code):ast.parse(s,filename=f'cell_{i}.py')
          last=code[-1]
          assert 'SEEDS=(2026,2027)' in last and 'EPOCHS=2' in last
          assert "MODEL_REVISION='12040accade4e8a0f71eabdb258fecc2e7e948be'" in last
          assert 'threshold_at_fpr(y_val,val_score,.05)' in last
          assert "os.environ.get('N12_ALLOW_CPU','0')" in last
          print('N12 all notebook cells AST PASS, two seeds, fixed validation thresholds')
          PY
      - name: Execute REAL pinned-source DistilBERT training and external evaluation
        run: |
          python - <<'PY'
          import nbformat,nbclient,time
          fname='notebooks/12_DistilBERT_Fine_Tune_External_Reliability.ipynb'
          nb=nbformat.read(fname,as_version=4)
          start=time.monotonic()
          nbclient.NotebookClient(nb,timeout=6000,kernel_name='python3',allow_errors=False).execute()
          print('N12 real-data full protocol executed, elapsed seconds:',round(time.monotonic()-start,1))
          PY
      - name: Validate safe aggregates, outcome counts and checksums
        run: |
          python - <<'PY'
          import pathlib,csv,hashlib,json
          p=pathlib.Path('phishing_n12_safe')
          m=json.loads((p/'run_manifest.json').read_text())
          assert m['execution_status']=='GITHUB_ACTIONS_CPU_REAL_DATA_COMPLETED'
          assert len(m['training_seeds'])==2
          for fn,expected in m['files'].items():
              assert hashlib.sha256((p/fn).read_bytes()).hexdigest()==expected,fn
          rows=list(csv.DictReader((p/'transformer_metrics.csv').open()))
          assert len(rows)==10,len(rows)
          assert {int(x['seed']) for x in rows}=={2026,2027}
          assert all(int(x['n'])>=300 for x in rows)
          for row in rows:
              if row['variant'] in ('d2_original','ephishllm_english_external'):
                  print('seed',row['seed'],row['variant'],'FPR',row['fpr'],'recall',row['recall'])
          print('N12 aggregate checksum and full model/seed test coverage PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-N12-safe-transformer-aggregate
          path: phishing_n12_safe/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit only N12 safe aggregate outputs (rebase-safe)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phishing_n12_safe/
          git diff --cached --quiet || git commit -m 'results: GitHub N12 DistilBERT two-seed CPU fine-tuning'
          # Notebook execution may modify tracked inputs or produce unrelated files.
          # Preserve ONLY the explicitly staged, privacy-safe aggregate commit.
          git status --short
          git restore --worktree .
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
